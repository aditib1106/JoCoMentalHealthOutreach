config_version: 'v8'
model_comment: 'jail_mh2_update1_formulation'
random_seed: 23895478

temporal_config:
  feature_start_time: '2000-01-01'
  feature_end_time: '2019-06-01'
  label_start_time: '2015-01-01'
  label_end_time: '2019-06-01'
  model_update_frequency: '3months'
  training_as_of_date_frequencies: ['1month']
  test_as_of_date_frequencies: ['1month']
  max_training_histories: ['20year']
  test_durations: ['0day']
  label_timespans: ['1year']

label_config:
  name: 'new_arrest_12m'
  query: |
    WITH released AS (
      SELECT b.entity_id
      FROM semantic.bookings b
      WHERE b.booking_date < '{as_of_date}'::date AND b.entity_id IS NOT NULL
      GROUP BY b.entity_id
      HAVING max(b.release_date) FILTER (WHERE b.release_date < '{as_of_date}'::date)
               >= '{as_of_date}'::date - interval '12 months'
         AND NOT bool_or(b.release_date IS NULL OR b.release_date >= '{as_of_date}'::date)
    ),
    flagged AS (
      SELECT r.entity_id FROM released r
      WHERE EXISTS (SELECT 1 FROM semantic.bookings b WHERE b.entity_id = r.entity_id
                      AND b.booking_date < '{as_of_date}'::date - 7 AND b.bjmhs_referred = 1)
         OR EXISTS (SELECT 1 FROM semantic.pretrial p WHERE p.entity_id = r.entity_id
                      AND p.create_date < '{as_of_date}'::date - 7 AND p.assessment_mh_flag = 1)
         OR EXISTS (SELECT 1 FROM semantic.lsir l WHERE l.entity_id = r.entity_id
                      AND GREATEST(l.assessment_date, l.created_date) < '{as_of_date}'::date - 7
                      AND (1 IN (l.ans_37,l.ans_38,l.ans_39,l.ans_40,l.ans_41,l.ans_42,l.ans_43,
                                 l.ans_44,l.ans_45,l.ans_46,l.ans_47,l.ans_48,l.ans_49,l.ans_50)
                           OR l.ans_39 = 0 OR l.ans_40 = 0))
    ),
    cohort AS (
      SELECT f.entity_id FROM flagged f
      WHERE NOT EXISTS (SELECT 1 FROM semantic.jcmhc_services s WHERE s.entity_id = f.entity_id
                          AND s.svc_date >= '{as_of_date}'::date - 97
                          AND s.svc_date <  '{as_of_date}'::date - 7)
    )
    SELECT c.entity_id,
           CASE WHEN EXISTS (
             SELECT 1 FROM semantic.bookings b JOIN semantic.booking_types t USING (booking_no)
             WHERE b.entity_id = c.entity_id
               AND b.booking_date >= '{as_of_date}'::date
               AND b.booking_date <  '{as_of_date}'::date + interval '{label_timespan}'
               AND t.book_types && ARRAY['VIEW','WARR','BW'])
           THEN 1 ELSE 0 END AS outcome
    FROM cohort c

feature_aggregations:
  -
    prefix: 'jail'
    from_obj: |
      (SELECT entity_id, booking_date AS knowledge_date,
              coalesce(bjmhs_referred, 0) AS screen_referred, mhs_total,
              (release_date - booking_date) AS stay_days
       FROM semantic.bookings WHERE entity_id IS NOT NULL) AS jail
    knowledge_date_column: 'knowledge_date'
    aggregates_imputation:
      all:
        type: 'zero'
    aggregates:
      - quantity: {bookings: '*'}
        metrics: ['count']
      - quantity: 'screen_referred'
        metrics: ['sum', 'max']
      - quantity: 'mhs_total'
        metrics: ['max']
      - quantity: 'stay_days'
        metrics: ['sum', 'max']
      - quantity: {days_since: "'{collate_date}'::date - knowledge_date"}
        metrics: ['min']
    intervals: ['1year', '3years', 'all']
    groups: ['entity_id']
  -
    prefix: 'mhsvc'
    from_obj: |
      (SELECT entity_id, svc_date AS knowledge_date FROM semantic.jcmhc_services
       WHERE entity_id IS NOT NULL AND svc_date >= '2000-01-01') AS mhsvc
    knowledge_date_column: 'knowledge_date'
    aggregates_imputation:
      all:
        type: 'zero'
    aggregates:
      - quantity: {services: '*'}
        metrics: ['count']
      - quantity: {days_since: "'{collate_date}'::date - knowledge_date"}
        metrics: ['min']
    intervals: ['1year', '3years', 'all']
    groups: ['entity_id']
  -
    prefix: 'mhcall'
    from_obj: |
      (SELECT entity_id, call_date AS knowledge_date FROM semantic.jcmhc_calls
       WHERE entity_id IS NOT NULL) AS mhcall
    knowledge_date_column: 'knowledge_date'
    aggregates_imputation:
      all:
        type: 'zero'
    aggregates:
      - quantity: {calls: '*'}
        metrics: ['count']
    intervals: ['1year', 'all']
    groups: ['entity_id']
  -
    prefix: 'amb'
    from_obj: |
      (SELECT entity_id, incident_ts::date AS knowledge_date,
              CASE WHEN primary_impression ILIKE ANY (ARRAY['%BEHAV%','%PSYCH%','%SUICID%'])
                   THEN 1 ELSE 0 END AS behavioral
       FROM semantic.ambulance_runs WHERE entity_id IS NOT NULL) AS amb
    knowledge_date_column: 'knowledge_date'
    aggregates_imputation:
      all:
        type: 'zero'
    aggregates:
      - quantity: {runs: '*'}
        metrics: ['count']
      - quantity: 'behavioral'
        metrics: ['sum']
    intervals: ['1year', 'all']
    groups: ['entity_id']
  -
    prefix: 'risk'
    from_obj: |
      (SELECT entity_id, GREATEST(assessment_date, created_date) AS knowledge_date,
              COALESCE(total_score, score) AS lsir_score, NULL::int AS pretrial_risk, NULL::int AS pretrial_mh
       FROM semantic.lsir WHERE entity_id IS NOT NULL AND GREATEST(assessment_date, created_date) IS NOT NULL
       UNION ALL
       SELECT entity_id, create_date, NULL, risk_level_int, assessment_mh_flag
       FROM semantic.pretrial WHERE entity_id IS NOT NULL) AS risk
    knowledge_date_column: 'knowledge_date'
    aggregates_imputation:
      all:
        type: 'zero'
    aggregates:
      - quantity: 'lsir_score'
        metrics: ['max']
      - quantity: 'pretrial_risk'
        metrics: ['max']
      - quantity: 'pretrial_mh'
        metrics: ['max']
    intervals: ['3years', 'all']
    groups: ['entity_id']


scoring:
  testing_metric_groups:
    - metrics: [precision@, recall@]
      thresholds:
        top_n: [50, 100, 200]
        percentiles: [1, 5, 10]
  training_metric_groups:
    - metrics: [precision@, recall@]
      thresholds:
        top_n: [100]

individual_importance:
  methods: []
  n_ranks: 1

grid_config:
  'sklearn.dummy.DummyClassifier':
    strategy: ['prior']
  'triage.component.catwalk.baselines.rankers.BaselineRankMultiFeature':
    rules:
      - [{feature: 'jail_entity_id_all_mhs_total_max', low_value_high_score: False}]
      - [{feature: 'risk_entity_id_all_lsir_score_max', low_value_high_score: False},
         {feature: 'risk_entity_id_all_pretrial_risk_max', low_value_high_score: False}]
